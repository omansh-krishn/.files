# ~/.config/hypr/modules/keybinds.conf -- keybindings and shortcuts
# see https://wiki.hypr.land/Configuring/Keywords/
# see https://wiki.hypr.land/Configuring/Binds/ for more

$mainMod = SUPER # sets "windows/super" key as main modifier

# application launchers
bind = $mainMod, Return, exec, $terminal # terminal emulator
bind = $mainMod ALT, F, exec, $fileManager # file manager
bind = $mainMod ALT, B, exec, /usr/bin/browser # web browser # used for bt ...
bind = $mainMod, space, exec, vicinae toggle # raycast clone
bind = $mainMod, E, exec, emacsclient -n -a "" -c
# bind = $mainMod, O, exec, obsidian # note taking app (obsidian)
bind = $mainMod SHIFT, space, exec, rofi -show drun -display-drun '' -theme ~/.config/rofi/colors/minimal_mid.rasi || pkill rofi # rofi


# window management
bind = $mainMod, Q, killactive # kill active window
bind = $mainMod, C, killactive # kill active window (duplicate)
bind = $mainMod SHIFT, Q, exec, hyprctl kill # murder
bind = $mainMod, V, togglefloating # toggle floating, pinch in on trackpad
bind = $mainMod, P, pseudo # centered pseudo mode ( dwindle )
bind = $mainMod, T, layoutmsg, togglesplit # switches b/w horizontal and vertical ( dwindle )

# layout
bind = $mainMod, bracketleft, exec, hyprctl keyword general:layout dwindle # super + [ - dwindle layout
bind = $mainMod, bracketright, exec, hyprctl keyword general:layout scrolling # super + ] - scrolling layout, see ./plugins/hyprscrolling.conf for info
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1 # maximize floating window

# focus movement (arrow keys and hjkl)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# swap windows
# (vim style - hjkl)
bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, J, swapwindow, d
# arrow keys
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, left, movetoworkspace, r-1
bind = $mainMod SHIFT, right, movetoworkspace, r+1

# special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = ALT, S, movetoworkspace, special:magic
bind = ALT SHIFT, S, movetoworkspace, e+0

# workspace scrolling (active)
# mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
#keys
 bind = CTRL ALT, left, workspace, e-1
 bind = CTRL ALT, right, workspace, e+1

# move and resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# waybar
bind = CTRL SHIFT, W, exec, killall -SIGUSR1 waybar && ~/.config/waybar/scripts/launch.sh || ~/.config/waybar/scripts/launch.sh
# bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh
# bind = $mainMod, W, exec, killall -SIGUSR1 waybar

# hyprland
bind = CTRL SHIFT, E, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# scripts and other commands
# bind = $mainMod, P, exec, ~/.config/waybar/scripts/powermenu.sh # opens the powermenu # conflits with dwindle.pseudotile
bind = $mainMod, X, exec, ~/.config/waybar/scripts/powermenu.sh
bind = $mainMod, N, exec, networkmanager_dmenu --config ~/.config/waybar/networkmanager_dmenu_config.ini
bind = $mainMod, B, exec, bzmenu -l rofi

# audio
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# screenshots
# bind = , Print, exec, grimblast -n copysave screen ~/Pictures/Screenshots/$(date +%d-%m-%y-%H%M%S).png # ( full screen ) save in folder & copy to clip
# bind = SHIFT, Print, exec, grimblast -n copysave area ~/Pictures/Screenshots/$(date +%d-%m-%y-%H%M%S).png # ( selection mode ) save in folder & copy to clip
# bind = CTRL, Print, exec, grimblast -n copysave active ~/Pictures/Screenshots/$(date +%d-%m-%y-%H%M%S).png # ( selection mode ) save in folder & copy to clip
bind = , Print, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = CTRL, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots

# hyprscrolling (moved to ./plugins/hyprscrolling.conf)
# bind = $mainMod CTRL, period, layoutmsg, move +col        # move focus to next column
# bind = $mainMod CTRL, comma, layoutmsg, move -col         # move focus to previous column
# bind = $mainMod SHIFT, period, movewindow, r  # move window to right column
# bind = $mainMod SHIFT, comma, movewindow, l   # move window to left column
# bind = $mainMod , period, movewindow, u      # move window up
# bind = $mainMod , comma, movewindow, d    # move window down

