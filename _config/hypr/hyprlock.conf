# src: https://github.com/Ltony2022/symphony/blob/14b3f37194913021a86ab7b8763abf39d295add9/.config/hypr/hyprlock.conf
# MIT

$color = rgba(0, 0, 0, 1)
$inner_color = rgba(0, 0, 0, 0.66)
$outer_color = rgba(116, 116, 116, 1)
$font_color = rgba(255, 255, 255, 1)
$check_color = rgba(134, 134, 134, 1)

background {
    monitor =
    path = screenshot
    blur_size = 4
    blur_passes = 3
    brightness = 0.7
    color = $color
}

input-field {
    monitor =
    size = 9%, 4%

    dots_size = 0.22
    dots_spacing = 0.14
    dots_center = true
    dots_rounding = -1

    outline_thickness = 3
    inner_color = $inner_color
    outer_color = $outer_color
    font_color = $font_color

    check_color = $check_color
    fail_color = rgba(ff6060ee)

    fade_on_empty = true
    fade_timeout = 1000
    hide_input = false

    placeholder_text = <i>Enter Password...</i>
    fail_text = FAIL <b>($ATTEMPTS)</b>

    position = 0,-4%
    halign = center
    valign = center

    rounding = 20
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 65
    font_family = SF Pro Display Bold

    position = 0, 30%
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $font_color
    font_size = 17
    font_family = SF Pro Display

    position = 0, 24%
    halign = center
    valign = center
}
